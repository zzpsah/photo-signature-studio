name: Windows Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name PhotoSignatureStudio app.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSignatureStudio-Windows
          path: dist/PhotoSignatureStudio.exe
